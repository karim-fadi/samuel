<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Samuel El Naby</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg1:#0f1e4a; --bg2:#1b3a8f; --bg3:#2a5bd7;
  --panel:#12224f; --panel2:#1a3070;
  --gold:#ffcc33; --gold2:#ff9a1f; --gold3:#a85f00;
  --blue:#3aa0ff; --blue2:#1b6be0;
  --green:#5bd35b; --green2:#2f9f2f;
  --red:#ff5a5a; --red2:#c62828;
  --purple:#b46bff; --purple2:#7b2fd6;
  --text:#fff; --muted:#9db4e6; --border:#0a1436;
  --shadow:0 6px 0 var(--border), 0 12px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Nunito',sans-serif;color:var(--text);background:radial-gradient(1200px 600px at 50% -10%,var(--bg3),var(--bg1) 60%);background-attachment:fixed;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(rgba(255,255,255,.06) 1.5px,transparent 1.5px);background-size:26px 26px;animation:drift 40s linear infinite}
@keyframes drift{to{background-position:260px 260px}}
h1,h2,h3{font-family:'Lilita One',cursive;letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.35)}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
img{display:block}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(180deg,rgba(15,30,74,.95),rgba(15,30,74,.6) 80%,transparent)}
.logo{display:flex;align-items:center;gap:8px;min-width:0}
.logo .crest{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:linear-gradient(160deg,var(--gold),var(--gold2));box-shadow:0 4px 0 var(--gold3),0 8px 14px rgba(0,0,0,.4);animation:bob 3s ease-in-out infinite;flex-shrink:0}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
.logo h1{font-size:20px;color:var(--gold);line-height:1}
.logo small{display:block;font-family:'Nunito';font-weight:800;font-size:10px;color:var(--muted);letter-spacing:2px;text-shadow:none;margin-top:2px}
.mechip{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 4px 0 var(--border);flex-shrink:0}
.mechip .av{width:34px;height:34px;border-radius:10px;overflow:hidden;background:var(--bg3);border:2px solid var(--gold)}
.mechip .av img{width:100%;height:100%;object-fit:cover}
.mechip .nm{font-weight:900;font-size:13px;line-height:1.1;max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mechip .kr{font-weight:900;color:var(--gold);font-size:12px}
main{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:6px 14px calc(100px + env(safe-area-inset-bottom));opacity:0;transform:translateX(40px) scale(.98);pointer-events:none;transition:opacity .3s,transform .35s cubic-bezier(.2,.9,.3,1.2)}
.page.active{opacity:1;transform:none;pointer-events:auto}
.page-title{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}
.page-title h2{font-size:30px;color:#fff}.page-title h2 span{color:var(--gold)}
.sub{color:var(--muted);font-weight:800;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#0d1a40,#08122e);border-top:3px solid #24408a;display:grid;grid-template-columns:repeat(7,1fr);gap:3px;box-shadow:0 -10px 30px rgba(0,0,0,.5)}
nav button{background:transparent;border-radius:14px;padding:6px 1px;min-width:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900;font-size:9px;color:var(--muted);transition:.2s}
nav button .ic{font-size:22px;transition:transform .3s cubic-bezier(.2,1.6,.4,1);filter:grayscale(.6)}
nav button.on{color:var(--gold);background:linear-gradient(180deg,#26449a,#1b3270);box-shadow:0 3px 0 var(--border)}
nav button.on .ic{transform:translateY(-4px) scale(1.25);filter:none}
nav button:active .ic{transform:scale(.85)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:18px;padding:14px;box-shadow:var(--shadow);border:2px solid #2d4da3;position:relative;animation:pop .4s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(10px)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:14px;font-family:'Lilita One';font-size:18px;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.3);background:linear-gradient(180deg,var(--blue),var(--blue2));box-shadow:0 5px 0 #0d3f8f,0 8px 12px rgba(0,0,0,.35);transition:transform .1s,box-shadow .1s;user-select:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0d3f8f}
.btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold2));box-shadow:0 5px 0 var(--gold3),0 8px 12px rgba(0,0,0,.35);color:#4a2a00;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn.gold:active{box-shadow:0 1px 0 var(--gold3)}
.btn.green{background:linear-gradient(180deg,var(--green),var(--green2));box-shadow:0 5px 0 #1b6b1b,0 8px 12px rgba(0,0,0,.35)}
.btn.green:active{box-shadow:0 1px 0 #1b6b1b}
.btn.red{background:linear-gradient(180deg,var(--red),var(--red2));box-shadow:0 5px 0 #7a1010,0 8px 12px rgba(0,0,0,.35)}
.btn.red:active{box-shadow:0 1px 0 #7a1010}
.btn.gray{background:linear-gradient(180deg,#6b7a99,#46526e);box-shadow:0 5px 0 #262d3f;color:#c7d0e6}
.btn.wide{width:100%}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-weight:900;font-size:12px;background:rgba(0,0,0,.3)}
.pill.gold{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#4a2a00}
/* RANK BOARD */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.scard{padding:0;overflow:hidden;cursor:pointer;transition:transform .15s}
.scard:active{transform:scale(.95)}
.scard .img{aspect-ratio:1;background:linear-gradient(160deg,#2b4fb0,#152a66);position:relative;overflow:hidden}
.scard .img img,.detail .big img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}
.init{position:absolute;inset:0;display:grid;place-items:center;font-family:'Lilita One';font-size:56px;color:rgba(255,255,255,.7)}
.scard .img::after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,transparent 60%,rgba(10,20,54,.9))}
.scard .info{padding:10px 10px 12px}
.scard .nm{font-family:'Lilita One';font-size:17px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .ar{font-size:11px;color:var(--muted);font-weight:900;margin:3px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .bd{display:flex;gap:2px;font-size:14px;min-height:18px;margin-top:6px}
.scard.me{border-color:var(--gold);box-shadow:0 6px 0 var(--gold3),0 0 22px rgba(255,204,51,.35)}
.scard.me::before{content:"YOU";position:absolute;top:8px;right:8px;z-index:3;font-family:'Lilita One';font-size:11px;padding:2px 7px;border-radius:8px;background:var(--gold);color:#4a2a00}
/* ARENA */
.arena-path{display:flex;flex-direction:column;gap:14px;padding:6px 0}
.arena{padding:16px;display:flex;align-items:center;gap:14px;transition:.3s;background:linear-gradient(135deg,var(--c1),var(--c2));border-color:rgba(255,255,255,.35)}
.arena .em{font-size:46px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35));animation:bob 3s ease-in-out infinite}
.arena h3{font-size:22px}.arena .req{font-weight:900;font-size:13px;opacity:.9}
.arena.locked{filter:grayscale(1) brightness(.45);border-color:#2d4da3}.arena.locked .em{animation:none}
.arena.current{transform:scale(1.03);box-shadow:0 6px 0 var(--border),0 0 30px rgba(255,204,51,.55);border-color:var(--gold)}
.arena .tag{margin-left:auto;font-family:'Lilita One';font-size:13px;padding:4px 10px;border-radius:10px;background:rgba(0,0,0,.35);text-align:center}
.arena.current .tag{background:var(--gold);color:#4a2a00}
.progress{height:16px;border-radius:999px;background:rgba(0,0,0,.4);overflow:hidden;border:2px solid var(--border);margin-top:8px}
.progress i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold2),var(--gold));box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);transition:width 1s cubic-bezier(.2,1,.3,1);width:0}
/* EVENTS */
.news h3{font-size:20px;margin-bottom:6px;color:var(--gold)}
.news p{font-weight:600;font-size:14px;line-height:1.45;color:#dbe6ff;white-space:pre-line}
.vote{display:flex;gap:8px;margin-top:12px}.vote .btn{flex:1;font-size:15px;padding:10px}
.vote .btn.chosen{outline:3px solid #fff;outline-offset:2px}
.vbar{display:flex;height:12px;border-radius:999px;overflow:hidden;margin-top:10px;background:rgba(0,0,0,.35)}
.vbar i{display:block;height:100%;transition:width .6s}.vbar .g{background:var(--green)}.vbar .n{background:var(--red)}
.vcount{display:flex;justify-content:space-between;font-size:12px;font-weight:900;margin-top:4px;color:var(--muted)}
/* CHALLENGES */
.chal{display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:12px}.chal:active{transform:scale(.97)}
.chal .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:linear-gradient(160deg,var(--purple),var(--purple2));box-shadow:0 4px 0 #4a1a8a;flex-shrink:0}
.chal h3{font-size:19px}.chal p{color:var(--muted);font-size:13px;font-weight:700;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chal.done .ic{background:linear-gradient(160deg,var(--green),var(--green2));box-shadow:0 4px 0 #1b6b1b}
.chal .st{margin-left:auto;flex-shrink:0}
/* BADGES */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
.badge{padding:12px 6px;text-align:center;cursor:pointer}
.badge .em{font-size:40px;display:inline-block}
.badge.on .em{animation:spin 6s linear infinite;filter:drop-shadow(0 0 10px rgba(255,204,51,.7))}
@keyframes spin{0%,80%,100%{transform:rotateY(0)}90%{transform:rotateY(180deg)}}
.badge.off{filter:grayscale(1);opacity:.5}
.badge .nm{font-family:'Lilita One';font-size:13px;margin-top:6px;line-height:1.1}.badge.on{border-color:var(--gold)}
/* SHOP */
.gift{text-align:center;padding:14px 10px;cursor:pointer}
.gift .em{font-size:48px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.gift .ph{width:100%;aspect-ratio:1;border-radius:14px;object-fit:cover;border:3px solid #2d4da3;box-shadow:0 4px 0 var(--border)}
.gift .nm{font-family:'Lilita One';font-size:16px;margin:8px 0 6px}
.gift .qty{font-size:11px;font-weight:900;color:var(--muted);margin-top:6px}
.gift.out{filter:grayscale(1);opacity:.55}
.gift.out::after{content:"SOLD OUT";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-15deg);font-family:'Lilita One';font-size:20px;color:var(--red);border:3px solid var(--red);padding:4px 10px;border-radius:8px;background:rgba(0,0,0,.6)}
/* MODAL */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,10,30,.75);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.25s}
.overlay.show{opacity:1;pointer-events:auto}
.modal{position:relative;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#1f3a85,#0f1e4a);border:3px solid #3a5fc4;border-bottom:none;transform:translateY(60px);transition:transform .35s cubic-bezier(.2,1.2,.3,1)}
.overlay.show .modal{transform:none}
@media(min-width:600px){.overlay{align-items:center}.modal{border-radius:26px;border-bottom:3px solid #3a5fc4}}
.modal .x{position:absolute;top:12px;right:14px;width:34px;height:34px;border-radius:10px;background:var(--red);box-shadow:0 3px 0 #7a1010;font-family:'Lilita One';font-size:18px;z-index:5}
.detail{text-align:center}
.detail .big{width:150px;height:150px;border-radius:26px;margin:0 auto 12px;overflow:hidden;border:4px solid var(--gold);box-shadow:0 8px 0 var(--gold3);background:var(--bg3);position:relative}
.detail .big .init{font-size:70px}
.detail h2{font-size:30px}
.stats{display:flex;gap:10px;justify-content:center;margin:12px 0}
.stat{flex:1;padding:10px;border-radius:14px;background:rgba(0,0,0,.3)}
.stat b{display:block;font-family:'Lilita One';font-size:22px;color:var(--gold)}.stat span{font-size:11px;font-weight:900;color:var(--muted)}
/* QUIZ */
.q-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.q-text{font-family:'Lilita One';font-size:22px;line-height:1.25;margin-bottom:16px}
.opt{display:block;width:100%;text-align:left;padding:14px;margin-bottom:10px;border-radius:14px;font-weight:800;font-size:15px;background:linear-gradient(180deg,#2c4ea8,#1d3577);box-shadow:0 4px 0 var(--border);transition:.15s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--border)}
.opt.right{background:linear-gradient(180deg,var(--green),var(--green2));box-shadow:0 4px 0 #1b6b1b}
.opt.wrong{background:linear-gradient(180deg,var(--red),var(--red2));box-shadow:0 4px 0 #7a1010;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.result{text-align:center;padding:10px 0}
.result .em{font-size:80px;animation:bounceIn .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes bounceIn{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.result h2{font-size:34px;color:var(--gold);margin:8px 0}
.result .earn{font-family:'Lilita One';font-size:44px;color:#fff;text-shadow:0 0 20px var(--gold)}
/* LOGIN */
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(800px 500px at 50% 0%,var(--bg3),var(--bg1) 70%)}
#login .box{width:100%;max-width:380px;text-align:center}
#login .crest{width:110px;height:110px;border-radius:32px;margin:0 auto 14px;display:grid;place-items:center;font-size:60px;background:linear-gradient(160deg,var(--gold),var(--gold2));box-shadow:0 10px 0 var(--gold3),0 20px 40px rgba(0,0,0,.5);animation:bob 3s ease-in-out infinite}
#login h1{font-size:36px;color:var(--gold);line-height:1.1}
#login p{color:var(--muted);font-weight:800;margin:10px 0 20px}
input.inp{width:100%;padding:14px;border-radius:14px;border:3px solid #3a5fc4;background:#0c1a44;color:#fff;font-family:'Nunito';font-weight:900;font-size:16px;text-align:center;outline:none;margin-bottom:12px}
input.inp:focus{border-color:var(--gold)}
.err{color:var(--red);font-weight:900;min-height:18px;font-size:13px;margin-bottom:8px}
.empty{text-align:center;color:var(--muted);font-weight:800;padding:40px 10px}.empty .em{font-size:50px;margin-bottom:8px}
#toast{position:fixed;left:50%;top:80px;transform:translate(-50%,-30px);z-index:200;padding:12px 20px;border-radius:14px;font-family:'Lilita One';font-size:17px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#4a2a00;box-shadow:0 5px 0 var(--gold3),0 10px 20px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.3s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:linear-gradient(180deg,var(--red),var(--red2));color:#fff;box-shadow:0 5px 0 #7a1010}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:300;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.7}}
.coins{color:var(--gold);font-weight:900}
/* BIRTHDAY */
.scard .cake{position:absolute;top:6px;left:6px;z-index:3;font-size:26px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4));animation:bob 2s ease-in-out infinite}
.scard.bday{border-color:#ff6bb5}
/* SPIRITUALS */
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.daybtn{padding:8px 2px;border-radius:14px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid #2d4da3;box-shadow:0 4px 0 var(--border);text-align:center;font-weight:900;transition:.15s}
.daybtn .wd{font-size:10px;color:var(--muted);letter-spacing:.5px}
.daybtn .dn{font-family:'Lilita One';font-size:20px;line-height:1.1}
.daybtn .dots{display:flex;gap:3px;justify-content:center;margin-top:4px}
.daybtn .dots i{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.45)}
.daybtn .dots i.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.daybtn.sel{border-color:var(--gold);background:linear-gradient(180deg,#26449a,#1b3270);transform:translateY(-3px)}
.daybtn.sel .dn{color:var(--gold)}
.sprow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;margin-top:10px;border-radius:16px;background:rgba(0,0,0,.28);border:2px solid transparent;transition:.15s}
.sprow:active{transform:scale(.97)}
.sprow .em{font-size:32px;width:40px;text-align:center;flex-shrink:0}
.sprow .tx{flex:1;min-width:0}
.sprow .tx b{display:block;font-family:'Lilita One';font-size:19px;font-weight:400}
.sprow .tx span{font-size:12px;font-weight:800;color:var(--muted)}
.sprow .box{width:38px;height:38px;border-radius:12px;border:3px solid #3a5fc4;background:#0c1a44;display:grid;place-items:center;font-family:'Lilita One';font-size:22px;flex-shrink:0;transition:.2s cubic-bezier(.2,1.6,.4,1)}
.sprow.on{border-color:var(--green);background:rgba(91,211,91,.14)}
.sprow.on .box{background:linear-gradient(180deg,var(--green),var(--green2));border-color:var(--green);transform:scale(1.1)}
.sprow.e3.on{border-color:var(--gold);background:rgba(255,204,51,.14)}
.sprow.e3.on .box{background:linear-gradient(180deg,var(--gold),var(--gold2));border-color:var(--gold);color:#4a2a00}
.spstat{display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:900;font-size:13px}
.spstat .lb{width:132px;flex-shrink:0;white-space:nowrap}
.spstat .progress{flex:1;margin-top:0;height:14px}
.spstat .ct{width:44px;text-align:right;color:var(--gold);flex-shrink:0}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <div class="crest">🪙</div>
    <h1>SAMUEL<br>EL NABY</h1>
    <p>Enter your Student ID to enter the arena</p>
    <input class="inp" id="loginId" placeholder="Student ID" autocomplete="off">
    <div class="err" id="loginErr"></div>
    <button class="btn gold wide" onclick="doLogin()">ENTER ⚔️</button>
  </div>
</div>

<div id="app">
  <header>
    <div class="logo">
      <div class="crest">🪙</div>
      <div><h1>SAMUEL EL NABY</h1><small>ARENA</small></div>
    </div>
    <div class="mechip" id="mechip" onclick="openStudent(me.id)">
      <div class="av"><img id="meImg" alt=""></div>
      <div><div class="nm" id="meName">—</div><div class="kr"><span id="meCoins">0</span> 🪙</div></div>
    </div>
  </header>

  <main>
    <section class="page active" id="p-rank">
      <div class="page-title"><h2>Player <span>Board</span></h2><span class="sub" id="rankCount"></span></div>
      <div class="grid" id="rankGrid"></div>
    </section>

    <section class="page" id="p-arena">
      <div class="page-title"><h2>Arena <span>Path</span></h2></div>
      <div class="card" style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:center">

    <section class="page" id="p-spirit">

      <div class="card" style="margin-bottom:14px">
        <div class="sub" id="spDayLbl"></div>

      </div>
      <div class="card" style="margin-bottom:14px">

<div id="toast"></div>

<script>
/* ============================================================
   1. FIREBASE CONFIG — paste your project's config here
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCo9k2OLVQprNoCFEjEAHVInOcvS7NlUvo",
  authDomain: "abrar-100.firebaseapp.com",
  projectId: "abrar-100",
  storageBucket: "abrar-100.firebasestorage.app",
  messagingSenderId: "1031124601739",
  appId: "1:1031124601739:web:0fbbf88a38d32ffae47d8e",
  measurementId: "G-YCSYCQ6DV2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const FV = firebase.firestore.FieldValue;
/* Everything lives under the "samuel-el-naby" collection:
   samuel-el-naby / app / students|events|challenges|shop|attendance|spirituals */
const ROOT = db.collection("samuel-el-naby").doc("app");
const col = name => ROOT.collection(name);

/* ============================================================
   2. GAME CONSTANTS (must match admin file)
   ============================================================ */
const IMG_DIR = "images/";
const COIN = "🪙";
const ARENAS = [
  {name:"Training Camp",   min:0,   em:"🏕️", c1:"#5bd35b", c2:"#2f9f2f"},
  {name:"Bethlehem Stable",min:50,  em:"⭐",  c1:"#ffcc33", c2:"#c47a00"},
  {name:"Nazareth Hills",  min:100, em:"🌄", c1:"#ff9a5b", c2:"#c2531a"},
  {name:"Galilee Shores",  min:150, em:"⛵", c1:"#3aa0ff", c2:"#1b5fc0"},
  {name:"Jordan River",    min:200, em:"🌊", c1:"#37d6d6", c2:"#127f9a"},
  {name:"Jericho Walls",   min:250, em:"🏰", c1:"#c9855a", c2:"#7a4322"},
  {name:"Mount Sinai",     min:300, em:"⛰️", c1:"#9a8cff", c2:"#5540c9"},
  {name:"Jerusalem Gates", min:350, em:"🕌", c1:"#ff6bb5", c2:"#b8237a"},
  {name:"Temple Courts",   min:400, em:"🏛️", c1:"#e6c15a", c2:"#8f6a00"},
  {name:"Heaven's Arena",  min:450, em:"👑", c1:"#ffffff", c2:"#9fc9ff"},
];
const BADGES = [
  {id:"first_step", em:"👣", name:"First Step", desc:"Earned your first Coins"},
  {id:"scholar",    em:"📖", name:"Scholar",    desc:"Completed 3 challenges"},
  {id:"perfect",    em:"💯", name:"Perfect",    desc:"Got 10/10 on a challenge"},
  {id:"faithful",   em:"🕊️", name:"Faithful",   desc:"Attended 5 meetings in a row"},
  {id:"early_bird", em:"🐦", name:"Early Bird", desc:"Arrived early 3 times"},
  {id:"helper",     em:"🤝", name:"Helper",     desc:"Helped a friend in class"},
  {id:"memorizer",  em:"🧠", name:"Memorizer",  desc:"Memorized a whole hymn"},
];

/* ============================================================
   3. STATE / HELPERS
   ============================================================ */
let me=null, students=[], news=[], challenges=[], shop=[];
/* Spirituals — stored in  spirituals/<studentId> :
   { days:{ "2026-10-09":{mp:true,np:true,bible:true} }, e3traf:{ "2026-10":true } }   (must match admin file) */
const SPIRIT = [
  {k:"mp",    em:"🌅", name:"Morning Prayer", sub:"Start the day with God"},
  {k:"np",    em:"🌙", name:"Night Prayer",   sub:"Thank God before you sleep"},
  {k:"bible", em:"📖", name:"Bible",          sub:"Read your Bible today"},
];
let spirit={days:{},e3traf:{}}, spDay=null;
const dkey = d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const mkey = d=>dkey(d).slice(0,7);
/* cake shows during the whole month of the student's birthday (birthday = "YYYY-MM-DD", set by admin) */
const isBdayMonth = s=>!!s.birthday && +String(s.birthday).slice(5,7)===new Date().getMonth()+1;
const $ = id=>document.getElementById(id);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* letter sits BEHIND the photo; shows only if the photo is missing */
const imgOf = s=>`<div class="init">${esc((s.name||"?")[0].toUpperCase())}</div><img src="${IMG_DIR}${encodeURIComponent(s.name)}.jpg" alt="" onerror="this.style.display='none'">`;
const arenaOf = e=>{let a=ARENAS[0];for(const x of ARENAS)if(e>=x.min)a=x;return a;};
const nextArena = e=>ARENAS.find(x=>x.min>e)||null;
function toast(m,bad){const t=$("toast");t.textContent=m;t.className=bad?"show bad":"show";clearTimeout(t._t);t._t=setTimeout(()=>t.className="",2200);}
function confetti(){const cs=["#ffcc33","#3aa0ff","#5bd35b","#ff5a5a","#b46bff","#fff"];for(let i=0;i<80;i++){const d=document.createElement("div");d.className="confetti";d.style.left=Math.random()*100+"vw";d.style.background=cs[i%cs.length];d.style.animationDuration=(1.5+Math.random()*1.5)+"s";d.style.animationDelay=Math.random()*.4+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),3500);}}
function openModal(h){$("modal").innerHTML=`<button class="x" onclick="closeModal()">✕</button>`+h;$("overlay").classList.add("show");}
function closeModal(){$("overlay").classList.remove("show");}

/* ============================================================
   4. LOGIN
   ============================================================ */
async function doLogin(){
  const id=$("loginId").value.trim(); if(!id) return;
  $("loginErr").textContent="";
  try{
    const snap=await col("students").doc(id).get();
    if(!snap.exists){$("loginErr").textContent="Student ID not found. Ask your teacher!";return;}
    localStorage.setItem("sen_id",id); startApp(id);
  }catch(e){$("loginErr").textContent="Connection error. Check Firebase config.";console.error(e);}
}
$("loginId").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
const savedId=localStorage.getItem("sen_id");
if(savedId){$("loginId").value=savedId;doLogin();}

/* ============================================================
   5. LIVE DATA
   ============================================================ */
function startApp(id){
  $("login").style.display="none";
  col("students").onSnapshot(s=>{
    students=s.docs.map(d=>({id:d.id,...d.data()}));
    students.forEach(x=>{x.earned=x.earned||0;x.coins=x.coins||0;x.badges=x.badges||[];x.done=x.done||{};});
    students.sort((a,b)=>a.name.localeCompare(b.name));   // alphabetical — no ranking shown
    me=students.find(x=>x.id===id);
    if(!me){localStorage.removeItem("sen_id");location.reload();return;}
    renderMe();renderRank();renderArena();renderBadges();renderShop();renderChal();renderNews();
  });
  col("spirituals").doc(id).onSnapshot(d=>{
    const x=d.data()||{}; spirit={days:x.days||{},e3traf:x.e3traf||{}}; renderSpirit();
  });
  col("events").orderBy("createdAt","desc").onSnapshot(s=>{news=s.docs.map(d=>({id:d.id,...d.data()}));renderNews();});
  col("challenges").orderBy("createdAt","desc").onSnapshot(s=>{challenges=s.docs.map(d=>({id:d.id,...d.data()}));renderChal();});
  col("shop").orderBy("cost").onSnapshot(s=>{shop=s.docs.map(d=>({id:d.id,...d.data()}));renderShop();});
}

/* ============================================================
   6. RENDERERS
   ============================================================ */
function renderMe(){
  $("meName").textContent=me.name; $("meCoins").textContent=me.coins;
  $("meImg").src=IMG_DIR+encodeURIComponent(me.name)+".jpg";
  $("shopBal").textContent=me.coins+" "+COIN;
}
function renderRank(){
  $("rankCount").textContent=students.length+" players";
  $("rankGrid").innerHTML=students.map((s,i)=>`
    <div class="card scard ${s.id===me.id?"me":""} ${isBdayMonth(s)?"bday":""}" style="animation-delay:${Math.min(i*40,400)}ms" onclick="openStudent('${esc(s.id)}')">
      ${isBdayMonth(s)?`<div class="cake" title="Birthday this month!">🎂</div>`:""}
      <div class="img">${imgOf(s)}</div>
      <div class="info">
        <div class="nm">${esc(s.name)}</div>
        <div class="ar">${arenaOf(s.earned).em} ${esc(arenaOf(s.earned).name)}</div>
        <span class="pill gold">${s.earned} ${COIN}</span>
        <div class="bd">${s.badges.slice(0,5).map(b=>{const x=BADGES.find(y=>y.id===b);return x?x.em:"";}).join("")}${s.badges.length>5?`<span style="font-size:11px;color:var(--muted)">+${s.badges.length-5}</span>`:""}</div>
      </div>
    </div>`).join("");
}
function openStudent(id){
  const s=students.find(x=>x.id===id); if(!s) return;
  const a=arenaOf(s.earned);
  openModal(`<div class="detail">
    <div class="big">${imgOf(s)}</div>
    <h2>${esc(s.name)}${isBdayMonth(s)?" 🎂":""}</h2>
    <div class="sub">${a.em} ${esc(a.name)}${isBdayMonth(s)?" • Birthday this month! 🎉":""}</div>
    <div class="stats">
      <div class="stat"><b>${s.earned}</b><span>COINS EARNED ${COIN}</span></div>
      <div class="stat"><b>${s.coins}</b><span>WALLET ${COIN}</span></div>
      <div class="stat"><b>${Object.keys(s.done).length}</b><span>CHALLENGES</span></div>
    </div>
    <h3 style="font-size:18px;margin:14px 0 8px;text-align:left">Badges (${s.badges.length})</h3>
    ${s.badges.length?`<div class="bgrid">${s.badges.map(b=>{const x=BADGES.find(y=>y.id===b);return x?`<div class="card badge on"><span class="em">${x.em}</span><div class="nm">${esc(x.name)}</div></div>`:"";}).join("")}</div>`:`<div class="empty">No badges yet</div>`}
  </div>`);
}
function renderArena(){
  const a=arenaOf(me.earned), n=nextArena(me.earned);
  $("curArenaName").textContent=a.em+" "+a.name;
  $("curEarned").textContent=me.earned+" "+COIN;
  const pct=n?Math.min(100,((me.earned-a.min)/(n.min-a.min))*100):100;
  requestAnimationFrame(()=>$("arenaBar").style.width=pct+"%");
  $("arenaNext").textContent=n?`${n.min-me.earned} ${COIN} to ${n.name}`:"You reached the top! 👑";
  $("arenaPath").innerHTML=[...ARENAS].reverse().map((x,i)=>{
    const reached=me.earned>=x.min, cur=x===a;
    return `<div class="card arena ${reached?"":"locked"} ${cur?"current":""}" style="--c1:${x.c1};--c2:${x.c2};animation-delay:${i*50}ms">
      <div class="em">${reached?x.em:"🔒"}</div>
      <div><h3>${esc(x.name)}</h3><div class="req">${x.min} ${COIN} required</div></div>
      <div class="tag">${cur?"YOU ARE HERE":reached?"UNLOCKED":"LOCKED"}</div></div>`;}).join("");
}
function renderNews(){
  if(!me) return;
  if(!news.length){$("newsList").innerHTML=`<div class="empty"><div class="em">📭</div>No events yet</div>`;return;}
  $("newsList").innerHTML=news.map((n,i)=>{
    const v=n.votes||{}, mine=v[me.id];
    const g=Object.values(v).filter(x=>x===true).length, no=Object.values(v).filter(x=>x===false).length, tot=g+no||1;
    return `<div class="card news" style="animation-delay:${i*60}ms">
      <h3>${esc(n.title)}</h3><p>${esc(n.text)}</p>
      <div class="vote">
        <button class="btn green ${mine===true?"chosen":""}" onclick="vote('${n.id}',true)">✅ I'm going</button>
        <button class="btn red ${mine===false?"chosen":""}" onclick="vote('${n.id}',false)">❌ Not going</button>
      </div>
      <div class="vbar"><i class="g" style="width:${g/tot*100}%"></i><i class="n" style="width:${no/tot*100}%"></i></div>
      <div class="vcount"><span>${g} going</span><span>${no} not going</span></div></div>`;}).join("");
}
async function vote(id,val){
  await col("events").doc(id).set({votes:{[me.id]:val}},{merge:true});
  toast(val?"See you there! 🎉":"Maybe next time 🙂");
}
function renderChal(){
  if(!me) return;
  if(!challenges.length){$("chalList").innerHTML=`<div class="empty"><div class="em">⚔️</div>No challenges yet</div>`;return;}
  $("chalList").innerHTML=challenges.map((c,i)=>{
    const done=me.done[c.id];
    return `<div class="card chal ${done?"done":""}" style="animation-delay:${i*60}ms" onclick="startChallenge('${c.id}')">
      <div class="ic">${done?"✅":"⚔️"}</div>
      <div style="min-width:0"><h3>${esc(c.title)}</h3><p>${esc(c.desc)}</p></div>
      <div class="st">${done?`<span class="pill gold">+${done} ${COIN}</span>`:`<span class="pill">${(c.questions||[]).length} Q</span>`}</div></div>`;}).join("");
}
function renderBadges(){
  const mine=new Set(me.badges);
  $("badgeCount").textContent=`${mine.size} / ${BADGES.length}`;
  $("badgeGrid").innerHTML=BADGES.map((b,i)=>`<div class="card badge ${mine.has(b.id)?"on":"off"}" style="animation-delay:${i*40}ms" onclick="toast('${esc(b.name)}: ${esc(b.desc)}')">
    <span class="em">${b.em}</span><div class="nm">${esc(b.name)}</div></div>`).join("");
}
function renderShop(){
  if(!me) return;
  if(!shop.length){$("shopGrid").innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="em">🎁</div>Shop is empty</div>`;return;}
  $("shopGrid").innerHTML=shop.map((g,i)=>`<div class="card gift ${g.qty<=0?"out":""}" style="animation-delay:${i*50}ms" onclick="buy('${g.id}')">
    ${g.photo?`<img class="ph" src="${g.photo}" alt="">`:`<div class="em">${esc(g.emoji||"🎁")}</div>`}
    <div class="nm">${esc(g.name)}</div>
    <span class="pill gold">${g.cost} ${COIN}</span>
    <div class="qty">${g.qty} left</div></div>`).join("");
}

/* ============================================================
   6b. SPIRITUALS (daily: Morning Prayer / Night Prayer / Bible — monthly: E3traf)
   ============================================================ */
function renderSpirit(){
  if(!me) return;
  const now=new Date(), today=dkey(now);
  if(!spDay||spDay>today) spDay=today;
  /* last 7 days, so a forgotten day can still be filled in */
  const days=Array.from({length:7},(_,i)=>{const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-6+i);return d;});
  if(spDay<dkey(days[0])) spDay=today;
  $("spToday").textContent=now.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"});
  $("spDays").innerHTML=days.map(d=>{
    const k=dkey(d), v=spirit.days[k]||{};
    return `<button class="daybtn ${k===spDay?"sel":""}" onclick="pickSpDay('${k}')">
      <div class="wd">${k===today?"TODAY":d.toLocaleDateString("en-GB",{weekday:"short"}).toUpperCase()}</div>
      <div class="dn">${d.getDate()}</div>
      <div class="dots">${SPIRIT.map(x=>`<i class="${v[x.k]?"on":""}"></i>`).join("")}</div></button>`;}).join("");
  const sel=days.find(d=>dkey(d)===spDay)||now, v=spirit.days[spDay]||{};
  $("spDayLbl").textContent=(spDay===today?"TODAY — ":"")+sel.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"}).toUpperCase();
  $("spChecks").innerHTML=SPIRIT.map(x=>`<button class="sprow ${v[x.k]?"on":""}" onclick="toggleSpirit('${x.k}')">
    <span class="em">${x.em}</span><span class="tx"><b>${x.name}</b><span>${x.sub}</span></span><span class="box">${v[x.k]?"✓":""}</span></button>`).join("");
  const mk=mkey(now), e3=spirit.e3traf[mk]===true;
  $("spMonthLbl").textContent="THIS MONTH — "+now.toLocaleDateString("en-GB",{month:"long",year:"numeric"}).toUpperCase();
  $("spE3traf").innerHTML=`<button class="sprow e3 ${e3?"on":""}" onclick="toggleE3traf()">
    <span class="em">✝️</span><span class="tx"><b>E3traf</b><span>${e3?"Done this month — well done!":"Tick when you have done it this month"}</span></span><span class="box">${e3?"✓":""}</span></button>`;
  const n=now.getDate();
  $("spStats").innerHTML=SPIRIT.map(x=>{
    let c=0; for(let i=1;i<=n;i++) if((spirit.days[`${mk}-${String(i).padStart(2,"0")}`]||{})[x.k]) c++;
    return `<div class="spstat"><span class="lb">${x.em} ${x.name}</span><div class="progress"><i style="width:${c/n*100}%"></i></div><span class="ct">${c}/${n}</span></div>`;}).join("");
}
function pickSpDay(k){ spDay=k; renderSpirit(); }
async function toggleSpirit(k){
  const cur=spirit.days[spDay]||{}, val=!cur[k];
  const allDone=val&&SPIRIT.every(x=>x.k===k||cur[x.k]);
  try{
    const p=col("spirituals").doc(me.id).set({days:{[spDay]:{[k]:val}}},{merge:true});
    if(allDone){confetti();toast("All three done! 🙏🎉");}
    await p;
  }catch(e){toast("Could not save. Check your connection.",true);}
}
async function toggleE3traf(){
  const mk=mkey(new Date()), val=spirit.e3traf[mk]!==true;
  try{
    const p=col("spirituals").doc(me.id).set({e3traf:{[mk]:val}},{merge:true});
    if(val){confetti();toast("E3traf done this month ✝️");}
    await p;
  }catch(e){toast("Could not save. Check your connection.",true);}
}

/* ============================================================
   7. QUIZ
   ============================================================ */
let quiz=null;
function startChallenge(id){
  const c=challenges.find(x=>x.id===id); if(!c) return;
  if(me.done[c.id]){toast(`Already completed: +${me.done[c.id]} ${COIN}`);return;}
  const qs=c.questions||[];
  if(!qs.length){toast("This challenge has no questions yet",true);return;}
  quiz={c,i:0,correct:0,locked:false};
  openModal(`<h2 style="font-size:24px;color:var(--gold)">${esc(c.title)}</h2><p class="sub" style="margin:6px 0 16px">${esc(c.desc)}</p>
    <div class="card" style="margin-bottom:14px;text-align:center"><div class="sub">REWARDS</div>
      <div style="display:flex;justify-content:space-around;margin-top:8px;font-family:'Lilita One';font-size:16px">
        <span>&lt;60% → 5 ${COIN}</span><span>60%+ → 7 ${COIN}</span><span>90%+ → 10 ${COIN}</span></div></div>
    <button class="btn gold wide" onclick="showQ()">START ⚔️</button>`);
}
function showQ(){
  const q=quiz.c.questions[quiz.i]; quiz.locked=false;
  openModal(`<div class="q-top"><span class="pill">Question ${quiz.i+1} / ${quiz.c.questions.length}</span><span class="pill gold">${quiz.correct} ✓</span></div>
    <div class="q-text">${esc(q.q)}</div>
    ${q.options.map((o,i)=>`<button class="opt" id="opt${i}" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}`);
}
function answer(i){
  if(quiz.locked) return; quiz.locked=true;
  const q=quiz.c.questions[quiz.i];
  if(i===q.answer){quiz.correct++;$("opt"+i).classList.add("right");}
  else{$("opt"+i).classList.add("wrong");$("opt"+q.answer).classList.add("right");}
  setTimeout(()=>{quiz.i++;if(quiz.i<quiz.c.questions.length)showQ();else finishQuiz();},900);
}
async function finishQuiz(){
  const n=quiz.c.questions.length, pct=quiz.correct/n*100;
  const pts=pct>=90?10:pct>=60?7:5;
  const ref=col("students").doc(me.id);
  try{
    await db.runTransaction(async t=>{
      const d=(await t.get(ref)).data();
      if((d.done||{})[quiz.c.id]) throw new Error("done");
      t.update(ref,{coins:(d.coins||0)+pts,earned:(d.earned||0)+pts,[`done.${quiz.c.id}`]:pts});
    });
    confetti();
    openModal(`<div class="result"><div class="em">${pct>=90?"🏆":pct>=60?"🎉":"💪"}</div>
      <h2>${pct>=90?"PERFECT!":pct>=60?"GREAT JOB!":"NICE TRY!"}</h2>
      <div class="sub">${quiz.correct} / ${n} correct</div>
      <div class="earn">+${pts} ${COIN}</div>
      <button class="btn gold wide" style="margin-top:16px" onclick="closeModal()">COLLECT</button></div>`);
  }catch(e){toast("Already completed!",true);closeModal();}
}

/* ============================================================
   8. SHOP
   ============================================================ */
function buy(id){
  const g=shop.find(x=>x.id===id); if(!g||g.qty<=0) return;
  if(me.coins<g.cost){toast(`Need ${g.cost-me.coins} more Coins ${COIN}`,true);return;}
  openModal(`<div class="result">${g.photo?`<img src="${g.photo}" style="width:140px;height:140px;object-fit:cover;border-radius:20px;margin:0 auto;border:3px solid var(--gold)">`:`<div class="em" style="animation:none">${esc(g.emoji||"🎁")}</div>`}
    <h2 style="font-size:26px">${esc(g.name)}</h2>
    <p class="sub">Buy for <span class="coins">${g.cost} ${COIN}</span>? You have ${me.coins} ${COIN}</p>
    <div style="display:flex;gap:10px;margin-top:16px"><button class="btn gray" style="flex:1" onclick="closeModal()">Cancel</button>
    <button class="btn gold" style="flex:1" onclick="confirmBuy('${g.id}')">BUY 🛒</button></div></div>`);
}
async function confirmBuy(id){
  const sref=col("students").doc(me.id), gref=col("shop").doc(id);
  try{
    await db.runTransaction(async t=>{
      const [s,g]=await Promise.all([t.get(sref),t.get(gref)]);
      const sd=s.data(), gd=g.data();
      if(gd.qty<=0) throw new Error("Sold out!");
      if((sd.coins||0)<gd.cost) throw new Error("Not enough Coins!");
      t.update(sref,{coins:sd.coins-gd.cost,purchases:FV.arrayUnion({item:gd.name,cost:gd.cost,at:Date.now()})});
      t.update(gref,{qty:gd.qty-1});
    });
    confetti();closeModal();toast("Purchased! Ask your teacher for it 🎁");
  }catch(e){toast(e.message||"Failed",true);closeModal();}
}

/* ============================================================
   9. NAV
   ============================================================ */
$("nav").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id==="p-"+b.dataset.p));
  if(b.dataset.p==="arena") renderArena();
  if(b.dataset.p==="spirit") renderSpirit();
});
</script>
